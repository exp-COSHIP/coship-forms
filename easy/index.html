<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EASY COSHIP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181d;--muted:#5f646c;--faint:#9aa0a8;--line:#e3e5e9;--bg:#f5f6f7;--red:#e31e24;--red-soft:#fdeced}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

header{background:var(--ink);color:#fff}
.top{max-width:1180px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:8px;padding:7px 12px;display:flex;align-items:center}
.logo img{height:60px;width:auto;display:block}
.brand .tx{display:flex;flex-direction:column;gap:2px}
.brand b{font-weight:900;font-size:20px;letter-spacing:.02em}
.brand b span{color:var(--red)}
.brand small{font-size:11px;color:#b7bcc4;letter-spacing:.08em}
.clocks{display:flex;gap:4px;margin-left:auto}
.clock{padding:6px 12px;border-radius:4px;background:#23262d;text-align:center;min-width:92px}
.clock .c{font-size:10.5px;color:#b7bcc4;letter-spacing:.06em}
.clock .t{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.clock .d{font-size:10.5px;color:#8b9099}
.clock.off .t{color:#8b9099}
.searchbar{max-width:1180px;margin:0 auto;padding:0 20px 16px}
.searchbar input{width:100%;padding:12px 16px;border-radius:5px;border:0;font-size:15px;background:#fff}
.notice{background:var(--red);color:#fff;font-size:13px}
.notice div{max-width:1180px;margin:0 auto;padding:8px 20px}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
section{margin-bottom:26px}
section h2{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
section h2::after{content:'';flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:3px;transition:border-color .12s,box-shadow .12s;min-height:84px}
.card:hover{border-color:var(--ink)}
.card.soon{background:transparent;border-style:dashed;cursor:default}
.card.soon:hover{border-color:var(--line)}
.card .nm{font-weight:700;font-size:14.5px;padding-right:46px}
.card .ds{font-size:12.5px;color:var(--muted)}
.card .tg{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin-top:auto;align-self:flex-start}
.card .tg.red{border-color:var(--red);color:var(--red)}
.card .acts{position:absolute;top:9px;right:8px;display:flex;gap:2px}
.ic{width:26px;height:26px;border-radius:4px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--faint)}
.ic:hover{background:var(--bg);color:var(--ink)}
.ic.on{color:var(--red)}
.ic svg{width:15px;height:15px}
.copied{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.copied.show{opacity:1}
.none{color:var(--faint);padding:30px 0;text-align:center}
footer{max-width:1180px;margin:0 auto;padding:0 20px 30px;font-size:12px;color:var(--faint)}
@media(max-width:700px){.logo img{height:46px}.clocks{margin-left:0;width:100%}.clock{flex:1;min-width:0}.grid{grid-template-columns:1fr}}
</style>
</head>

};

if(NOTICE) $('notice').innerHTML=`<div>${esc(NOTICE)}</div>`;

/* 지사 시각 */
const ZONES=[['밴쿠버','America/Vancouver'],['토론토','America/Toronto'],['서울','Asia/Seoul']];
function tick(){
  const now=new Date();
  $('clocks').innerHTML=ZONES.map(([c,z])=>{
    const t=new Intl.DateTimeFormat('ko-KR',{timeZone:z,hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
    const d=new Intl.DateTimeFormat('ko-KR',{timeZone:z,month:'numeric',day:'numeric',weekday:'short'}).format(now);
    const h=+new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'numeric',hour12:false}).format(now);
    const wd=new Intl.DateTimeFormat('en-US',{timeZone:z,weekday:'short'}).format(now);
    const open=h>=9&&h<18&&!['Sat','Sun'].includes(wd);
    return `<div class="clock ${open?'':'off'}" title="${open?'업무 시간':'업무 시간 외'}"><div class="c">${c}</div><div class="t">${t}</div><div class="d">${d}</div></div>`;
  }).join('');
}
tick(); setInterval(tick,30000);

/* 렌더 */
function card(it){
  const k=it.n;
  if(it.soon) return `<div class="card soon"><div class="nm">${esc(it.n)}</div><div class="ds">${esc(it.d)}</div><span class="tg">${esc(it.tag||'준비 중')}</span></div>`;
  return `<a class="card" href="${esc(it.u)}" target="_blank" rel="noopener">
    <div class="acts">
      ${it.copy?`<button class="ic" data-copy="${esc(it.u)}" title="링크 복사">${IC.copy}</button>`:''}
      <button class="ic ${fav.includes(k)?'on':''}" data-fav="${esc(k)}" title="즐겨찾기">${IC.star}</button>
    </div>
    <div class="nm">${esc(it.n)}</div><div class="ds">${esc(it.d)}</div>
    ${it.tag?`<span class="tg ${it.red?'red':''}">${esc(it.tag)}</span>`:''}
  </a>`;
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const match=it=>!q||(it.n+' '+it.d+' '+(it.tag||'')+' '+(it.sec||'')).toLowerCase().includes(q);
  const all=SECTIONS.flatMap(s=>s.items.map(it=>({...it,sec:s.title})));
  let html='';
  const favs=all.filter(it=>fav.includes(it.n)&&!it.soon&&match(it));
  if(favs.length) html+=`<section><h2>★ 즐겨찾기</h2><div class="grid">${favs.map(card).join('')}</div></section>`;
  SECTIONS.forEach(s=>{
    const its=s.items.map(it=>({...it,sec:s.title})).filter(match);
    if(its.length) html+=`<section><h2>${esc(s.title)}</h2><div class="grid">${its.map(card).join('')}</div></section>`;
  });
  $('main').innerHTML=html||'<div class="none">찾는 항목이 없습니다. 다른 단어로 검색해 보세요.</div>';
}
$('q').oninput=render;
$('main').addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]'), f=e.target.closest('[data-fav]');
  if(c){e.preventDefault();navigator.clipboard.writeText(c.dataset.copy).then(()=>{$('copied').classList.add('show');setTimeout(()=>$('copied').classList.remove('show'),1200)})}
  if(f){e.preventDefault();const k=f.dataset.fav;fav=fav.includes(k)?fav.filter(x=>x!==k):[...fav,k];store.set(fav);render()}
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});
render();
</script>
</body>
</html>
